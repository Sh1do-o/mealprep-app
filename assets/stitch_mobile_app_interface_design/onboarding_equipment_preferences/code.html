<body class="bg-background text-on-background font-body-md antialiased flex flex-col min-h-screen pt-14 pb-safe">
<!-- Transactional Intent: No Navigation Shell (TopAppBar/BottomNavBar Suppressed) -->
<main class="flex-grow px-margin-mobile py-lg flex flex-col max-w-md mx-auto w-full">
<!-- Header Section -->
<header class="mb-lg text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Setup Your Kitchen</h1>
<div class="bg-surface-container rounded-xl p-md mt-sm border border-outline-variant relative">
<div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[12px] border-l-transparent border-b-[12px] border-b-surface-container border-r-[12px] border-r-transparent"></div>
<p class="font-coach-dialogue text-coach-dialogue text-on-surface">Hey there! Let's tailor DormDish to your taste and budget.</p>

<!-- Dietary Preferences Selection -->

<div class="flex flex-wrap gap-sm" id="dietary-tags">
<button class="dietary-tag flex items-center justify-start px-4 py-2 rounded-full border border-outline-variant bg-surface-bright text-on-surface transition-all duration-200" data-selected="false">

</button>
<button class="dietary-tag flex items-center justify-start px-4 py-2 rounded-full border border-outline-variant bg-surface-bright text-on-surface transition-all duration-200" data-selected="false">
<span class="font-body-md text-body-md">No Vegetables</span>
</button>
<button class="dietary-tag flex items-center justify-start px-4 py-2 rounded-full border border-outline-variant bg-surface-bright text-on-surface transition-all duration-200" data-selected="false">
<span class="font-body-md text-body-md">Vegetarian</span>
</button>
<button class="dietary-tag flex items-center justify-start px-4 py-2 rounded-full border border-outline-variant bg-surface-bright text-on-surface transition-all duration-200" data-selected="false">
<span class="font-body-md text-body-md">Halal</span>
</button>
</div>

<!-- Equipment Selection -->

<div class="grid grid-cols-2 gap-sm" id="equipment-grid">
<!-- Equipment Chips -->
<button class="equipment-chip flex items-center justify-start p-md rounded-lg border border-outline-variant bg-surface-bright text-on-surface transition-all duration-200" data-selected="false">
<span class="material-symbols-outlined mr-2 text-on-surface-variant icon-unselected">rice_bowl</span>
<span class="material-symbols-outlined mr-2 text-on-primary hidden icon-selected">check_circle</span>
<span class="font-body-md text-body-md">Rice Cooker</span>
</button>
<button class="equipment-chip flex items-center justify-start p-md rounded-lg border border-outline-variant bg-surface-bright text-on-surface transition-all duration-200" data-selected="false">

</div>

</div>

<span>₱300</span>
<span>₱700</span>
</div>

<!-- Fixed Bottom Action -->
<div class="mt-auto pt-lg pb-md">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-xl shadow-[0_4px_14px_0_rgba(78,222,163,0.2)] transition-transform duration-150 active:scale-95 flex items-center justify-center">
                Ready to Cook
                <span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Dietary Selection Logic
        const dietaryTags = document.querySelectorAll('.dietary-tag');
        
        dietaryTags.forEach(tag => {
            tag.addEventListener('click', function() {
                const isSelected = this.getAttribute('data-selected') === 'true';
                setDietaryState(this, !isSelected);
            });
        });
        
        function setDietaryState(tag, isSelected) {
            tag.setAttribute('data-selected', isSelected);
            if (isSelected) {
                tag.classList.remove('border-outline-variant', 'bg-surface-bright', 'text-on-surface');
                tag.classList.add('border-primary', 'bg-primary', 'text-on-primary');
            } else {
                tag.classList.add('border-outline-variant', 'bg-surface-bright', 'text-on-surface');
                tag.classList.remove('border-primary', 'bg-primary', 'text-on-primary');
            }
        }

        // Equipment Selection Logic
        const chips = document.querySelectorAll('.equipment-chip');
        const chipNone = document.getElementById('chip-none');

        chips.forEach(chip => {
            chip.addEventListener('click', function() {
                const isSelected = this.getAttribute('data-selected') === 'true';
                const isNoneChip = this === chipNone;

                if (isNoneChip) {
                    // If 'None' is clicked, deselect everything else
                    chips.forEach(c => {
                        if (c !== chipNone) setChipState(c, false);
                    });
                    setChipState(this, !isSelected);
                } else {
                    // If a regular equipment is clicked, deselect 'None'
                    setChipState(chipNone, false);
                    setChipState(this, !isSelected);
                }
            });
        });

        function setChipState(chip, isSelected) {
            chip.setAttribute('data-selected', isSelected);
            const iconUnselected = chip.querySelector('.icon-unselected');
            const iconSelected = chip.querySelector('.icon-selected');

            if (isSelected) {
                chip.classList.remove('border-outline-variant', 'bg-surface-bright', 'text-on-surface');
                chip.classList.add('border-primary', 'bg-primary', 'text-on-primary', 'shadow-[0_4px_14px_0_rgba(78,222,163,0.1)]');
                iconUnselected.classList.add('hidden');
                iconSelected.classList.remove('hidden');
            } else {
                chip.classList.add('border-outline-variant', 'bg-surface-bright', 'text-on-surface');
                chip.classList.remove('border-primary', 'bg-primary', 'text-on-primary', 'shadow-[0_4px_14px_0_rgba(78,222,163,0.1)]');
                iconUnselected.classList.remove('hidden');
                iconSelected.classList.add('hidden');
            }
        }

        // Budget Slider Logic
        const slider = document.getElementById('budget-slider');
        const display = document.getElementById('budget-display');
        const fill = document.getElementById('slider-fill');

        function updateSlider() {
            const val = slider.value;
            const min = slider.min;
            const max = slider.max;
            const percentage = ((val - min) / (max - min)) * 100;
            
            display.textContent = `₱${val}`;
            fill.style.width = `${percentage}%`;
        }

        slider.addEventListener('input', updateSlider);
        // Initial setup
        updateSlider();
    </script>
</body></html>
